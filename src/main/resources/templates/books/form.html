
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{book.new}">New book</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<h1 th:text="#{book.new}">New book</h1>

<p>
    <a th:href="@{/books/new(lang='en')}">English</a> |
    <a th:href="@{/books/new(lang='ru')}">Русский</a>
</p>

<form th:action="@{/books}" th:object="${form}" method="post">

    <!-- Общие ошибки валидации -->
    <div class="alert" th:if="${#fields.hasAnyErrors()}">
        <ul>
            <li th:each="error : ${#fields.allErrors()}"
                th:text="${error}">
            </li>
        </ul>
    </div>

    <!-- Название -->
    <div>
        <label for="title" th:text="#{book.title}">Title</label>
        <input type="text"
               id="title"
               th:field="*{title}"
               th:errorclass="is-invalid">

        <span class="error"
              th:if="${#fields.hasErrors('title')}"
              th:errors="*{title}"></span>
    </div>

    <!-- Автор -->
    <div>
        <label for="author" th:text="#{book.author}">Author</label>
        <input type="text"
               id="author"
               th:field="*{author}"
               th:errorclass="is-invalid">

        <span class="error"
              th:if="${#fields.hasErrors('author')}"
              th:errors="*{author}"></span>
    </div>

    <!-- Год -->
    <div>
        <label for="year" th:text="#{book.year}">Year</label>
        <input type="number"
               id="year"
               th:field="*{year}"
               th:errorclass="is-invalid">

        <span class="error"
              th:if="${#fields.hasErrors('year')}"
              th:errors="*{year}"></span>
    </div>

    <!-- Жанр -->
    <div>
        <label for="genre" th:text="#{book.genre}">Genre</label>
        <select id="genre"
                th:field="*{genre}"
                th:errorclass="is-invalid">

            <option value="">—</option>

            <option th:each="g : ${genres}"
                    th:value="${g}"
                    th:text="${g}">
            </option>
        </select>

        <span class="error"
              th:if="${#fields.hasErrors('genre')}"
              th:errors="*{genre}"></span>
    </div>

    <!-- Доступность -->
    <div>
        <label for="available">
            <input type="checkbox"
                   id="available"
                   th:field="*{available}">
            <span th:text="#{book.available}">Available</span>
        </label>
    </div>

    <!-- Дата публикации: вариант 7 -->
    <div>
        <label for="publicationDate"
               th:text="#{book.publicationDate}">
            Publication date
        </label>

        <input type="date"
               id="publicationDate"
               th:field="*{publicationDate}"
               th:errorclass="is-invalid">

        <span class="error"
              th:if="${#fields.hasErrors('publicationDate')}"
              th:errors="*{publicationDate}">
        </span>
    </div>

    <!-- Кнопки -->
    <div>
        <button type="submit" th:text="#{form.submit}">Save</button>
        <a th:href="@{/books}" th:text="#{form.cancel}">Cancel</a>
    </div>

</form>

</body>
</html>
